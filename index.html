
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111315">
  <meta name="description" content="RAMIN AI LAB - لێرەدا داهاتووی تەکنەلۆژیا دروست دەکەین.">
  <title>RAMIN AI LAB | بەزوویی دێت</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 40%, #242a30 0%, #15191d 45%, #0d0f11 100%);
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 50px 20px;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-family: Arial, sans-serif;
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 800;
      letter-spacing: 3px;
      direction: ltr;
      margin-bottom: 12px;
    }

    .logo span {
      color: #54c8ff;
    }

    .line {
      width: 65px;
      height: 3px;
      background: #54c8ff;
      margin: 25px auto;
      border-radius: 10px;
      box-shadow: 0 0 15px #54c8ff;
    }

    .status {
      display: inline-block;
      border: 1px solid #54c8ff55;
      color: #54c8ff;
      padding: 9px 22px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 30px;
      background: #54c8ff0c;
    }

    h1 {
      font-size: clamp(25px, 5vw, 38px);
      margin-bottom: 22px;
      line-height: 1.8;
    }

    .description {
      color: #aab2ba;
      font-size: 16px;
      line-height: 2.2;
      max-width: 550px;
      margin: auto;
    }

    .footer {
      margin-top: 65px;
      color: #646d76;
      font-size: 12px;
      direction: ltr;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      background: #168dcc;
      filter: blur(150px);
      opacity: 0.12;
      border-radius: 50%;
      pointer-events: none;
    }

    .glow.one {
      top: -100px;
      right: -100px;
    }

    .glow.two {
      bottom: -150px;
      left: -100px;
    }

  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="container">

    <div class="logo">RAMIN <span>AI</span> LAB</div>

    <div class="line"></div>

    <div class="status">● لەژێر دروستکردندایە</div>

    <h1>شتێکی گەورە لە ڕێگادایە!</h1>

    <p class="description">
      ئێمە خەریکی دروستکردنی شتێکی نوێین.
      <br>
      RAMIN AI LAB بەم زووانە دەبێتە جێگایەک بۆ
      دۆزینەوە، فێربوون و داهێنان لە جیهانی
      <strong>AI و Cybersecurity</strong>.
      <br><br>
      داهاتوو لێرەوە دەست پێ دەکات.
    </p>

    <div class="footer">
      © 2026 RAMIN AI LAB — ALL RIGHTS RESERVED
    </div>

  </main>

</body>
</html>
