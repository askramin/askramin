
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0e">

  <title>RAMIN AI LAB — بەزوویی</title>
  <meta name="description" content="RAMIN AI LAB — هەندێک دەستپێک، داهاتوو دەگۆڕن.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #090b0e;
      --blue: #56c8ff;
      --text: #f5f7fa;
      --muted: #89939e;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(#ffffff07 1px, transparent 1px),
        linear-gradient(90deg, #ffffff07 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: radial-gradient(ellipse at center, black, transparent 80%);
      pointer-events: none;
    }

    .ambient {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .13;
      pointer-events: none;
      animation: breathe 7s ease-in-out infinite alternate;
    }

    .ambient.one {
      background: #168eff;
      top: -200px;
      left: -150px;
    }

    .ambient.two {
      background: #00e5ff;
      bottom: -250px;
      right: -150px;
      animation-delay: 2s;
    }

    @keyframes breathe {
      from { transform: scale(.8); opacity: .08; }
      to { transform: scale(1.2); opacity: .19; }
    }

    /* Main */
    .container {
      width: min(90%, 760px);
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 35px 15px;
      animation: appear 1.3s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      direction: ltr;
      font-family: Arial, sans-serif;
      font-size: clamp(27px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 22px;
    }

    .brand span {
      color: var(--blue);
      text-shadow: 0 0 25px #56c8ff65;
    }

    .symbol {
      width: 75px;
      height: 75px;
      border: 1px solid #56c8ff65;
      border-radius: 23px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 31px;
      font-weight: bold;
      color: var(--blue);
      transform: rotate(-45deg);
      box-shadow: 0 0 35px #56c8ff15,
                  inset 0 0 25px #56c8ff10;
    }

    .symbol span {
      transform: rotate(45deg);
    }

    .status {
      direction: ltr;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 19px;
      border: 1px solid #56c8ff35;
      background: #56c8ff0b;
      border-radius: 50px;
      color: var(--blue);
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    .status i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #56c8ff;
      box-shadow: 0 0 12px #56c8ff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% { opacity: .25; }
    }

    h1 {
      font-size: clamp(27px, 5vw, 43px);
      font-weight: 800;
      line-height: 1.9;
      margin-bottom: 15px;
    }

    h1 span {
      color: var(--blue);
    }

    .message {
      font-size: clamp(15px, 2.5vw, 18px);
      color: #aab3be;
      line-height: 2.5;
      max-width: 580px;
      margin: 0 auto;
    }

    .divider {
      width: 65px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      margin: 32px auto;
      box-shadow: 0 0 15px #56c8ff;
    }

    .quote {
      font-size: 15px;
      line-height: 2.4;
      color: #e1e7ed;
      font-weight: 500;
      padding: 0 10px;
    }

    .quote span {
      color: var(--blue);
    }

    .footer {
      margin-top: 65px;
      direction: ltr;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #58616b;
    }

    .footer strong {
      color: #89939e;
      font-weight: normal;
    }

    /* Mobile */
    @media(max-width: 480px) {
      .symbol {
        width: 65px;
        height: 65px;
      }

      .footer {
        margin-top: 45px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <main class="container">

    <div class="symbol">
      <span>R</span>
    </div>

    <div class="brand">
      RAMIN <span>AI</span> LAB
    </div>

    <div class="status">
      <i></i>
      SOMETHING IS COMING
    </div>

    <h1>
      داهاتوو چاوەڕێی <span>کەس</span> ناکات.
    </h1>

    <p class="message">
      هەندێک دەستپێک، بە دەنگی بەرز ڕاناگەیەنرێن.
      <br>
      بەڵام ئەنجامەکانیان جیهانێک دەگۆڕن.
    </p>

    <div class="divider"></div>

    <p class="quote">
      « مەبەست تەنها ئەوە نییە ببینە بەشێک لە داهاتوو؛
      <br>
      <span>مەبەستمان ئەوەیە داهاتوو دروست بکەین.</span> »
    </p>

    <div class="footer">
      <strong>RAMIN AI LAB</strong> &nbsp;·&nbsp;
      THE BEGINNING IS NEAR &nbsp;·&nbsp; © 2026
    </div>

  </main>

</body>
</html>
