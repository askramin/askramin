<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAMiiN — Coming Soon</title>
  <meta name="description" content="RAMiiN is coming soon.">

  <style>
    /* ==========================================================
       1. DESIGN TOKENS
       ========================================================== */
    :root {
      --bg-0: #0d0e11;          /* deepest charcoal */
      --bg-1: #17191f;          /* lifted charcoal */
      --line: rgba(255, 255, 255, 0.08);
      --text: #eceef3;          /* primary text */
      --muted: #8a90a0;         /* secondary text */
      --accent: #6ee7f9;        /* ice cyan */
      --accent-2: #8b7bff;      /* soft violet */
      --glow: rgba(110, 231, 249, 0.35);

      /* Latin + Kurdish (Arabic script) system font stacks, no downloads */
      --font-latin: "Segoe UI", "Helvetica Neue", Inter, system-ui, -apple-system, Roboto, Arial, sans-serif;
      --font-kurdish: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", "Arabic Typesetting", Arial, sans-serif;
    }

    /* ==========================================================
       2. RESET & BASE
       ========================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font-latin);
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%, #1d2029 0%, transparent 70%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      background-color: var(--bg-0);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Faint technical grid, fades out toward the edges */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 68%);
              mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 68%);
      opacity: 0.6;
      pointer-events: none;
    }

    /* Kurdish text: right-to-left, and NO letter-spacing (breaks Arabic joining) */
    [lang="ckb"] {
      font-family: var(--font-kurdish);
      direction: rtl;
      letter-spacing: 0 !important;
    }

    /* ==========================================================
       3. PAGE LAYOUT
       ========================================================== */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(1.5rem, 4vw, 3rem) 1.25rem;
      text-align: center;
    }

    /* ---------- Brand (top) ---------- */
    .brand {
      font-size: clamp(1.1rem, 2.4vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 0.32em;
      padding-left: 0.32em;     /* optically re-centres tracked text */
      color: var(--text);
      text-shadow: 0 0 18px var(--glow);
    }

    /* ---------- Centre stack ---------- */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.5rem, 4vh, 2.5rem);
      width: 100%;
      max-width: 40rem;
    }

    /* ==========================================================
       4. SPINNER — three counter-rotating rings + pulsing core
       ========================================================== */
    .spinner {
      --size: clamp(120px, 26vw, 168px);
      position: relative;
      width: var(--size);
      height: var(--size);
      display: grid;
      place-items: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    /* Outer ring: cyan arc, clockwise */
    .ring--outer {
      inset: 0;
      border-top-color: var(--accent);
      border-right-color: rgba(110, 231, 249, 0.18);
      filter: drop-shadow(0 0 8px var(--glow));
      animation: spin 1.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    /* Middle ring: violet arc, counter-clockwise */
    .ring--middle {
      inset: 16%;
      border-bottom-color: var(--accent-2);
      border-left-color: rgba(139, 123, 255, 0.18);
      filter: drop-shadow(0 0 8px rgba(139, 123, 255, 0.45));
      animation: spin 2.6s linear infinite reverse;
    }

    /* Inner ring: thin dashed orbit */
    .ring--inner {
      inset: 32%;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      animation: spin 9s linear infinite;
    }

    /* Glowing core */
    .core {
      width: 14%;
      height: 14%;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px 4px var(--glow), 0 0 48px 10px rgba(139, 123, 255, 0.25);
      animation: pulse 2.2s ease-in-out infinite;
    }

    /* ==========================================================
       5. TYPOGRAPHY
       ========================================================== */
    .title {
      font-size: clamp(2.1rem, 8.5vw, 4.5rem);
      font-weight: 200;
      line-height: 1.05;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      background: linear-gradient(180deg, #ffffff 25%, #9aa1b3 100%);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: breathe 4.5s ease-in-out infinite;
    }

    .title--ku {
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      font-weight: 600;
      line-height: 1.4;
      margin-top: -0.5rem;
      /* Kurdish title uses a solid colour for crisp Arabic glyphs */
      background: none;
      -webkit-text-fill-color: var(--text);
      color: var(--text);
      animation: none;
      opacity: 0.9;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      font-weight: 300;
      color: var(--muted);
      line-height: 1.6;
    }

    .subtitle--ku {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      margin-top: 0.25rem;
    }

    /* ==========================================================
       6. PROGRESS BAR
       ========================================================== */
    .progress {
      position: relative;
      width: min(18rem, 70vw);
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      box-shadow: 0 0 12px var(--glow);
      animation: sweep 2.4s ease-in-out infinite;
    }

    /* ==========================================================
       7. STATUS + LOADING DOTS (bottom)
       ========================================================== */
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status__row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      letter-spacing: 0.28em;
    }

    .dots {
      display: inline-flex;
      gap: 6px;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--glow);
      animation: dot 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.18s; }
    .dots span:nth-child(3) { animation-delay: 0.36s; }

    .status__ku { font-size: 0.9rem; }

    /* ==========================================================
       8. KEYFRAMES
       ========================================================== */
    @keyframes spin   { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.7; }
      50%      { transform: scale(1.25); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(110, 231, 249, 0)); }
      50%      { filter: drop-shadow(0 0 22px rgba(110, 231, 249, 0.28)); }
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    @keyframes dot {
      0%, 80%, 100% { transform: translateY(0) scale(0.7); opacity: 0.35; }
      40%           { transform: translateY(-6px) scale(1); opacity: 1; }
    }

    /* ==========================================================
       9. RESPONSIVE + ACCESSIBILITY
       ========================================================== */
    @media (max-width: 480px) {
      .title    { letter-spacing: 0.1em; padding-left: 0.1em; }
      .brand    { letter-spacing: 0.24em; }
      .status__row { letter-spacing: 0.2em; }
    }

    @media (max-height: 560px) {
      .stage { gap: 1rem; }
      .spinner { --size: 96px; }
    }

    /* Respect users who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- Brand name -->
    <header class="brand" aria-label="RAMiiN">RAMiiN</header>

    <!-- Centre content -->
    <section class="stage">

      <!-- Animated CSS spinner (decorative) -->
      <div class="spinner" aria-hidden="true">
        <span class="ring ring--outer"></span>
        <span class="ring ring--middle"></span>
        <span class="ring ring--inner"></span>
        <span class="core"></span>
      </div>

      <!-- English -->
      <div>
        <h1 class="title">COMING SOON</h1>
        <p class="subtitle">Something amazing is on the way...</p>
      </div>

      <!-- Kurdish (Sorani) -->
      <div lang="ckb" dir="rtl">
        <h2 class="title title--ku">بەم زووانە</h2>
        <p class="subtitle subtitle--ku">شتێکی سەرسوڕهێنەر لە ڕێگایە...</p>
      </div>

      <!-- Indeterminate progress bar -->
      <div class="progress" role="progressbar" aria-label="Loading"></div>
    </section>

    <!-- Status text + loading dots -->
    <footer class="status" role="status">
      <div class="status__row">
        <span>PLEASE WAIT</span>
        <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </div>
      <span class="status__ku" lang="ckb" dir="rtl">تکایە چاوەڕێ بکە...</span>
    </footer>

  </main>
</body>
</html>
